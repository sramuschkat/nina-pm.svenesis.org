# Lokale Datenbank als DSQL-Ersatz (TK 6.9): PostgreSQL 16 mit Repeatable Read wie DSQL.
# pnpm db:up → pnpm db:migrate → pnpm db:seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ninapm
    command: ['postgres', '-c', 'default_transaction_isolation=repeatable read']
    ports:
      - '5432:5432'
    volumes:
      - ninapm-db:/var/lib/postgresql/data
volumes:
  ninapm-db:
