openapi: 3.1.0
info:
  title: Svenesis NINA-PM API
  version: "1"
  description: "Generiert aus packages/shared (zod) – nicht von Hand ändern. Fehler als application/problem+json mit Codes aus docs/contracts/errors.json. Nicht-GET unter /api/auth, /api/web/v1, /api/system/v1 verlangt X-NPM-Request: 1 (SV-04)."
servers:
  - url: https://nina-pm.svenesis.org
components:
  securitySchemes:
    ninaToken:
      type: http
      scheme: bearer
      description: Sync-Token `npm_…` der NINA-Instanz (an genau ein Rig gebunden, widerrufbar).
  schemas:
    PublicBanner:
      type: object
      properties:
        banner:
          type:
            - object
            - "null"
          properties:
            de:
              type: string
            en:
              type: string
          required:
            - de
            - en
      required:
        - banner
    InvitationClaimResponse:
      type: object
      properties:
        tenantName:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - user
      required:
        - tenantName
        - role
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - validation.failed
            - auth.unauthenticated
            - auth.no_membership
            - auth.identity_blocked
            - auth.mfa_required
            - auth.csrf_missing
            - auth.rate_limited
            - permission.denied
            - tenant.not_found
            - tenant.locked
            - resource.not_found
            - resource.version_conflict
            - resource.in_use
            - resource.read_only
            - invitation.invalid
            - invitation.expired
            - invitation.already_member
            - member.owner_protected
            - super_user.last_protected
            - member.cannot_change_self
            - member.owner_cannot_leave
            - owner_transfer.target_invalid
            - approval.not_allowed
            - approval.own_object
            - approval.incomplete
            - approval.rig_conflict
            - vote.own_object
            - vote.closed
            - ranking.incomplete
            - change_request.conflict
            - change_request.not_open
            - transit.lock_not_allowed
            - transit.deadline_passed
            - rig.sort_chain_invalid
            - rig.flip_settings_invalid
            - discord.webhook_invalid
            - discord.test_failed
            - job.not_found
            - file.too_large
            - file.type_not_allowed
            - nina.token_invalid
            - engine.incompatible
            - session.rig_busy
            - session.unknown
            - session.closed
            - capture.batch_too_large
            - event.batch_too_large
            - plan.targets_etag_mismatch
            - canonical.non_finite
            - system.maintenance
            - internal.error
            - transit.share_mismatch
            - transit.too_many_open
            - transit.window_overlap
            - transit.ephemeris_stale
            - exo.epoch_out_of_range
            - transit.result_time_system
            - validation.min_time_too_small
            - project.status_transition_invalid
            - rig.change_has_captures
            - correction.conflict
            - site_night.has_session
            - capture.not_rejectable
            - capture.assign_mismatch
            - line.locked_by_captures
            - nina.night_invalid
            - engine.input_invalid
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - type
        - title
        - status
        - code
    InvitationClaimRequest:
      type: object
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - token
    InvitationPreview:
      type: object
      properties:
        tenantName:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - user
        expiresAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - tenantName
        - role
        - expiresAt
    InvitationPreviewRequest:
      type: object
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - token
    MeResponse:
      type: object
      properties:
        identity:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID
            discordUserId:
              type: string
            username:
              type: string
            globalName:
              type:
                - string
                - "null"
            avatarHash:
              type:
                - string
                - "null"
            mfa:
              type: boolean
          required:
            - id
            - discordUserId
            - username
            - globalName
            - avatarHash
            - mfa
        context:
          type: string
          enum:
            - tenant
            - system
            - select
        tenant:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
              description: UUID
            key:
              type: string
            name:
              type: string
            timeZone:
              type: string
          required:
            - id
            - key
            - name
            - timeZone
        member:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
              description: UUID
            displayName:
              type: string
            role:
              type: string
              enum:
                - owner
                - admin
                - user
            effectiveRole:
              type: string
              enum:
                - admin
                - user
          required:
            - id
            - displayName
            - role
            - effectiveRole
        isSuperUser:
          type: boolean
        mfaRequired:
          type: boolean
        memberships:
          type: array
          items:
            type: object
            properties:
              tenantKey:
                type: string
              tenantName:
                type: string
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - user
            required:
              - tenantKey
              - tenantName
              - role
      required:
        - identity
        - context
        - tenant
        - member
        - isSuperUser
        - mfaRequired
        - memberships
    ContextRequest:
      anyOf:
        - type: object
          properties:
            tenantKey:
              type: string
              pattern: ^[a-z0-9-]{3,32}$
          required:
            - tenantKey
          additionalProperties: false
        - type: object
          properties:
            system:
              type: boolean
              enum:
                - true
          required:
            - system
          additionalProperties: false
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionView"
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - sessions
        - lastLoginAt
    SessionView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        current:
          type: boolean
        device:
          type:
            - string
            - "null"
        ipTruncated:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
        lastSeenAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - id
        - current
        - device
        - ipTruncated
        - createdAt
        - lastSeenAt
    JobResult:
      oneOf:
        - $ref: "#/components/schemas/MultiSimResult"
        - $ref: "#/components/schemas/ImpactResult"
      discriminator:
        propertyName: kind
        mapping:
          multi_sim: "#/components/schemas/MultiSimResult"
          impact: "#/components/schemas/ImpactResult"
    MultiSimResult:
      type: object
      properties:
        kind:
          type: string
          enum:
            - multi_sim
        rigId:
          type: string
          format: uuid
          description: UUID
        rigName:
          type: string
        siteTimeZone:
          type: string
        nightFrom:
          type: string
          format: date
          example: 2026-09-18
        nightCount:
          type: integer
          minimum: 1
        weather:
          type: boolean
        computedAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
        nights:
          type: array
          items:
            $ref: "#/components/schemas/MultiSimNight"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/MultiSimProject"
      required:
        - kind
        - rigId
        - rigName
        - siteTimeZone
        - nightFrom
        - nightCount
        - weather
        - computedAt
        - nights
        - projects
    MultiSimNight:
      type: object
      properties:
        night:
          type: string
          format: date
          example: 2026-09-18
        darkHours:
          type:
            - number
            - "null"
          minimum: 0
        weight:
          type: number
          minimum: 0
          maximum: 1
        ratingIndex:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 4
        hasForecast:
          type: boolean
        exposureHours:
          type: number
          minimum: 0
        projects:
          type: array
          items:
            type: object
            properties:
              projectId:
                type: string
                format: uuid
                description: UUID
              frames:
                type: number
                minimum: 0
              hours:
                type: number
                minimum: 0
            required:
              - projectId
              - frames
              - hours
      required:
        - night
        - darkHours
        - weight
        - ratingIndex
        - hasForecast
        - exposureHours
        - projects
    MultiSimProject:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: UUID
        name:
          type: string
        approvalStatus:
          type: string
        needFrames:
          type: integer
          minimum: 0
        simulatedFrames:
          type: number
          minimum: 0
        hours:
          type: number
          minimum: 0
        nightsUsed:
          type: integer
          minimum: 0
        completesNight:
          type:
            - string
            - "null"
          format: date
          example: 2026-09-18
        sharePct:
          type: number
          minimum: 0
          maximum: 100
        filters:
          type: array
          items:
            type: object
            properties:
              filter:
                type: string
              need:
                type: integer
                minimum: 0
              simulated:
                type: number
                minimum: 0
            required:
              - filter
              - need
              - simulated
      required:
        - projectId
        - name
        - approvalStatus
        - needFrames
        - simulatedFrames
        - hours
        - nightsUsed
        - completesNight
        - sharePct
        - filters
    ImpactResult:
      type: object
      properties:
        kind:
          type: string
          enum:
            - impact
        queueItemId:
          type: string
          format: uuid
          description: UUID
        projectId:
          type: string
          format: uuid
          description: UUID
        projectName:
          type: string
        rigId:
          type: string
          format: uuid
          description: UUID
        rigName:
          type: string
        nightFrom:
          type: string
          format: date
          example: 2026-09-18
        nightCount:
          type: integer
          minimum: 1
        computedAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
        target:
          allOf:
            - $ref: "#/components/schemas/MultiSimProject"
            - type:
                - object
                - "null"
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/ImpactShift"
        hoursWithout:
          type: number
          minimum: 0
        hoursWith:
          type: number
          minimum: 0
      required:
        - kind
        - queueItemId
        - projectId
        - projectName
        - rigId
        - rigName
        - nightFrom
        - nightCount
        - computedAt
        - target
        - shifts
        - hoursWithout
        - hoursWith
    ImpactShift:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: UUID
        name:
          type: string
        hoursWithout:
          type: number
          minimum: 0
        hoursWith:
          type: number
          minimum: 0
        framesWithout:
          type: number
          minimum: 0
        framesWith:
          type: number
          minimum: 0
        completesWithout:
          type:
            - string
            - "null"
          format: date
          example: 2026-09-18
        completesWith:
          type:
            - string
            - "null"
          format: date
          example: 2026-09-18
      required:
        - projectId
        - name
        - hoursWithout
        - hoursWith
        - framesWithout
        - framesWith
        - completesWithout
        - completesWith
    JobView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        kind:
          type: string
          enum:
            - multi_sim
            - impact
            - effort
            - session_close
            - session_report
            - discord_post
            - export
            - import
            - thumbnail
            - transit_result_parse
            - catalog_refresh
            - forecast
            - reconcile
            - weather
            - noop
        status:
          type: string
          enum:
            - pending
            - running
            - done
            - failed
        attempts:
          type: integer
        errorCode:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
        startedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-09-18T13:00:00Z
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-09-18T13:00:00Z
        hasResult:
          type: boolean
      required:
        - id
        - kind
        - status
        - attempts
        - errorCode
        - createdAt
        - startedAt
        - finishedAt
        - hasResult
    DownloadUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - url
        - expiresAt
    MemberView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        displayName:
          type: string
        discordUsername:
          type: string
        avatarHash:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - owner
            - admin
            - user
        status:
          type: string
          enum:
            - active
            - disabled
            - removed
        mfa:
          type: boolean
        rightsDormant:
          type: boolean
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-09-18T13:00:00Z
        objects:
          type: object
          properties:
            draft:
              type: integer
            submitted:
              type: integer
            approved:
              type: integer
          required:
            - draft
            - submitted
            - approved
      required:
        - id
        - displayName
        - discordUsername
        - avatarHash
        - role
        - status
        - mfa
        - rightsDormant
        - lastLoginAt
        - objects
    MemberPatch:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum:
            - active
            - disabled
      additionalProperties: false
    RoleChangeRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - user
        reason:
          type: string
          maxLength: 500
      required:
        - role
      additionalProperties: false
    OwnerTransferRequest:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
          description: UUID
      required:
        - memberId
      additionalProperties: false
    InvitationCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        role:
          type: string
          enum:
            - owner
            - admin
            - user
        link:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - id
        - role
        - link
        - expiresAt
    CreateUserInvitationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        discordUserId:
          type: string
          pattern: ^\d{5,25}$
        validDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        note:
          type: string
          maxLength: 500
        maxUses:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
      required:
        - id
      additionalProperties: false
    CreateSingleUseInvitationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        discordUserId:
          type: string
          pattern: ^\d{5,25}$
        validDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        note:
          type: string
          maxLength: 500
      required:
        - id
      additionalProperties: false
    InvitationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        role:
          type: string
          enum:
            - owner
            - admin
            - user
        discordUserId:
          type:
            - string
            - "null"
        note:
          type:
            - string
            - "null"
        maxUses:
          type: integer
        usedCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-09-18T13:00:00Z
        createdAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
        ownerOnly:
          type: boolean
      required:
        - id
        - role
        - discordUserId
        - note
        - maxUses
        - usedCount
        - expiresAt
        - revokedAt
        - createdAt
        - ownerOnly
    Preferences:
      type: object
      properties:
        ui.theme:
          type: string
          enum:
            - light
            - dark
        ui.density:
          type: string
          enum:
            - compact
            - normal
            - wide
        ui.navCollapsed:
          type: boolean
        project.defaultConditions:
          type: object
          properties:
            minAltitudeDeg:
              type: number
              minimum: 0
              maximum: 90
            minTimeOnTargetH:
              type: number
              exclusiveMinimum: 0
              maximum: 24
            twilight:
              type: string
              enum:
                - astronomical
                - nautical
                - civil
            moonAvoidanceEnabled:
              type: boolean
            moonMustBeDown:
              type: boolean
            moonSeparationDeg:
              type: number
              minimum: 0
              maximum: 180
            moonWidthDays:
              type: number
              minimum: 0
            moonRelaxScale:
              type: number
              minimum: 0
            moonMinAltDeg:
              type: number
              minimum: -90
              maximum: 90
            moonMaxAltDeg:
              type: number
              minimum: -90
              maximum: 90
            moonMaxIlluminationPct:
              type: number
              minimum: 0
              maximum: 100
          required:
            - minAltitudeDeg
            - minTimeOnTargetH
            - twilight
            - moonAvoidanceEnabled
            - moonMustBeDown
            - moonSeparationDeg
            - moonWidthDays
            - moonRelaxScale
            - moonMinAltDeg
            - moonMaxAltDeg
            - moonMaxIlluminationPct
          additionalProperties: false
    PreferenceValue:
      type: object
      properties:
        value: {}
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationView"
        unreadCount:
          type: integer
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
        - unreadCount
        - nextCursor
    NotificationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        kind:
          type: string
          enum:
            - submission.new
            - submission.withdrawn
            - submission.edited_by_admin
            - approval.approved
            - approval.returned
            - approval.rejected
            - approval.expired
            - deadline.near
            - change_request.new
            - change_request.decided
            - vote.subject_changed
            - vote.subject_resubmitted
            - project.completed
            - transit.confirmation_needed
            - role.changed
            - owner.reassigned
            - alert.rig_busy
            - alert.session_no_heartbeat
            - alert.plugin_dead_letters
            - alert.nina_settings_mismatch
            - alert.discord_channel_failed
        payload:
          type: object
          additionalProperties: {}
        projectId:
          type:
            - string
            - "null"
          format: uuid
          description: UUID
        readAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-09-18T13:00:00Z
        createdAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - id
        - kind
        - payload
        - projectId
        - readAt
        - createdAt
    UnreadCount:
      type: object
      properties:
        unreadCount:
          type: integer
      required:
        - unreadCount
    MarkNotificationsRead:
      anyOf:
        - type: object
          properties:
            ids:
              type: array
              items:
                type: string
                format: uuid
                description: UUID
              minItems: 1
              maxItems: 200
          required:
            - ids
          additionalProperties: false
        - type: object
          properties:
            all:
              type: boolean
              enum:
                - true
          required:
            - all
          additionalProperties: false
    SystemAuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SystemAuditEntry"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
    SystemAuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID
        actor:
          type: string
          enum:
            - super_user
            - ops_cli
        actorName:
          type:
            - string
            - "null"
        tenantId:
          type:
            - string
            - "null"
          format: uuid
          description: UUID
        tenantKey:
          type:
            - string
            - "null"
        action:
          type: string
        details:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - id
        - actor
        - actorName
        - tenantId
        - tenantKey
        - action
        - details
        - createdAt
    ChangeLogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeLogEntry"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
    ChangeLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity:
          type: string
        entityId:
          type: string
          format: uuid
        actorName:
          type:
            - string
            - "null"
        subjectName:
          type:
            - string
            - "null"
        action:
          type: string
        diff:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
          format: date-time
          example: 2026-09-18T13:00:00Z
      required:
        - id
        - entity
        - entityId
        - actorName
        - subjectName
        - action
        - diff
        - createdAt
    TenantSettingsView:
      type: object
      properties:
        displayName:
