name: plugin

# NINA-Plugin (TK 18, 10.5, AP-16a): die Lösung apps/nina-plugin/NinaPm.sln.
# - cross-build (ubuntu-latest): Kern bauen und testen, Adapter, Adapter-Tests und Ansichten bauen – ohne -p:-Schalter;
#   Paket- und Ausgabeprüfung, Zeitregel (DateTime.Now bricht den Build), keine XAML-Datei im Adapter.
#   Bricht dieser Auftrag, ist die Entwicklung ohne Windows kaputt.
# - build (windows-latest): Kern- und Adapter-Tests ausführen, Plugin veröffentlichen (win-x64), Inhalt prüfen, ZIP.
# - release (nur Tag plugin-v*): ZIP und Beispielsequenzen als GitHub-Release-Asset. Kein AWS-Zugang (E1) –
#   die Beispielsequenzen kommen mit dem nächsten lokalen `pnpm deploy:prod` nach S3 (TK 4.1, 12).
# Übersetzt wird gegen die NuGet-Pakete NINA.* in der Version aus apps/nina-plugin/Directory.Build.props (ADR-S2c).

on:
  pull_request:
    paths:
      - 'apps/nina-plugin/**'
      - 'docs/api/openapi.nina.json'
      - 'spikes/nina-probe/**'
      - 'spikes/jint-runtime/**'
      - 'packages/engine/**'
      - 'tools/engine-bundle/**'
      - 'tools/nina-test-server/**'
      - 'tools/nina-sim/**'
      - 'tools/test-run-check/**'
      - 'packages/shared/src/contracts/nina/**'
      - 'docs/contracts/nina/**'
      - 'packages/shared/contracts/test-vectors/**'
      - 'tools/nina-build-check.sh'
      - 'tools/nina-banned-api-check.sh'
      - 'tools/nina-zip-check.sh'
      - 'tools/nina-release-check.sh'
      - '.github/workflows/plugin.yml'
  push:
    branches: [main]
    tags: ['plugin-v*']
    paths:
      - 'apps/nina-plugin/**'
      - 'docs/api/openapi.nina.json'
      - 'spikes/nina-probe/**'
      - 'spikes/jint-runtime/**'
      - 'packages/engine/**'
      - 'tools/engine-bundle/**'
      - 'tools/nina-test-server/**'
      - 'tools/nina-sim/**'
      - 'tools/test-run-check/**'
      - 'packages/shared/src/contracts/nina/**'
      - 'docs/contracts/nina/**'
      - 'packages/shared/contracts/test-vectors/**'
      - 'tools/nina-build-check.sh'
      - 'tools/nina-banned-api-check.sh'
      - 'tools/nina-zip-check.sh'
      - 'tools/nina-release-check.sh'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

env:
  # Eigene Abhängigkeiten im Plugin-Ordner (TK 10.1, 10.5) – alles andere bringt NINA mit.
  PLUGIN_DEPS: Microsoft.Data.Sqlite,SQLitePCLRaw.batteries_v2,SQLitePCLRaw.core,SQLitePCLRaw.provider.e_sqlite3,e_sqlite3,Polly,Polly.Core

jobs:
  # Engine- und Jint-Prüfungen (500 Pläne unter Jint ≈ 4 min, Jint-Laufzeit ≈ 2,5 min) sagen nur etwas, wenn sich
  # Engine, Bundle, Testvektoren oder die Jint-Tests ändern. In PRs laufen sie nur dann; auf `main` (push) immer.
  # Das Plugin plant nie selbst (Entscheidung Sven 01.10.2026), Jint ist nur noch Referenz der Engine-Parität.
  changes:
    name: Engine geändert?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "engine=true" >> "$GITHUB_OUTPUT"; echo "Kein PR: volle Prüfung"; exit 0
          fi
          engine=false
          while IFS= read -r f; do
            case "$f" in
              packages/engine/*|tools/engine-bundle/*|spikes/jint-runtime/*|packages/shared/contracts/test-vectors/*|\
              apps/nina-plugin/NinaPm.Core.Tests/EngineBundle.cs|apps/nina-plugin/NinaPm.Core.Tests/EngineParityTests.cs|\
              apps/nina-plugin/NinaPm.Core.Tests/PlanParityTests.cs|.github/workflows/plugin.yml) engine=true ;;
            esac
          done <<< "$(git diff --name-only "$BASE" HEAD)"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "Engine geändert: $engine"

  # Sichert die Entwicklung ohne Windows: bricht dieser Auftrag, ist der lokale Arbeitsablauf auf macOS/Linux kaputt.
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Paritätstests (Jint ↔ Node) brauchen das Engine-Bundle und laufen im Auftrag engine-parity.
      - name: Kern bauen und testen
        run: dotnet test -c Release apps/nina-plugin/NinaPm.Core.Tests --filter "FullyQualifiedName!~Parity"
      - name: Adapter, Adapter-Tests und Ansichten bauen (ohne -p:-Schalter)
        run: |
          dotnet build -c Release apps/nina-plugin/NinaPm.Nina
          dotnet build -c Release apps/nina-plugin/NinaPm.Nina.Tests
          dotnet build -c Release apps/nina-plugin/NinaPm.Nina.Ui
      - name: Keine XAML-Datei im Adapter (Regel 13)
        run: |
          found=$(find apps/nina-plugin/NinaPm.Nina -name '*.xaml' -not -path '*/bin/*' -not -path '*/obj/*')
          [ -z "$found" ] || { echo "XAML in NinaPm.Nina: $found"; exit 1; }
      - name: NINA-Version, Ausgabe und keine DLL im Git
        run: tools/nina-build-check.sh --allow "$PLUGIN_DEPS" apps/nina-plugin
      - name: Zeitregel – DateTime.Now bricht den Build (NT-05)
        run: tools/nina-banned-api-check.sh
      - name: Probe-Plugin AP-S2b bauen
        run: |
          dotnet build -c Release spikes/nina-probe
          tools/nina-build-check.sh spikes/nina-probe

  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Kern-Tests
        run: dotnet test -c Release apps/nina-plugin/NinaPm.Core.Tests --filter "FullyQualifiedName!~Parity"
      - name: Adapter-Tests (nur unter Windows ausführbar)
        # Hängt ein Test (z. B. WPF auf STA-Threads), bricht er nach 2 min mit seinem Namen ab statt nach dem Job-Limit.
        run: dotnet test -c Release apps/nina-plugin/NinaPm.Nina.Tests --blame-hang-timeout 2m
      - name: Plugin veröffentlichen (win-x64, ohne eigene Laufzeit)
        run: dotnet publish -c Release -r win-x64 --self-contained false apps/nina-plugin/NinaPm.Nina -o out/Svenesis.NinaPm
      - name: Inhalt prüfen (TK 10.5)
        run: tools/nina-zip-check.sh out/Svenesis.NinaPm
      # Inhalt nach %LOCALAPPDATA%\NINA\Plugins\3.0.0\Svenesis.NinaPm\ entpacken (TK 10.5).
      - uses: actions/upload-artifact@v4
        with:
          name: nina-pm-plugin
          path: out/Svenesis.NinaPm/
          retention-days: 30
      # AP-S2b: Probe-Plugin für die Protokolle P-01…P-03, P-13 (spikes/nina-probe/README.md).
      - name: Probe-Plugin bauen
        run: dotnet build -c Release spikes/nina-probe
      - uses: actions/upload-artifact@v4
        with:
          name: nina-pm-probe
          path: spikes/nina-probe/bin/Release/NinaPm.Probe.dll
          retention-days: 30

  # Nur beim Tag plugin-v* (setzt Sven): ZIP und Beispielsequenzen als Release-Asset (TK 18, E1).
  release:
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    needs: [cross-build, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: nina-pm-plugin
          path: Svenesis.NinaPm
      - name: ZIP und Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tag = Plugin-Version aus NinaPm.Nina.csproj (Manifest-Version, AP-16h); ZIP mit SHA-256-Prüfsumme.
          tools/nina-release-check.sh "$TAG"
          zip -r "nina-pm-$TAG.zip" Svenesis.NinaPm
          sha256sum "nina-pm-$TAG.zip" > "nina-pm-$TAG.zip.sha256"
          assets=("nina-pm-$TAG.zip" "nina-pm-$TAG.zip.sha256")
          shopt -s nullglob
          sequences=(apps/nina-plugin/NinaPm.Nina/Samples/*.json)
          # Sequenzen kommen mit AP-16c/AP-50/AP-52; ohne *.json kein leeres ZIP.
          if (( ${#sequences[@]} )); then
            zip -j "nina-pm-sequences-$TAG.zip" "${sequences[@]}"
            assets+=("nina-pm-sequences-$TAG.zip")
          fi
          gh release create "$TAG" "${assets[@]}" --title "NINA-PM Plugin $TAG" --notes "Siehe docs/CHANGELOG.md."

  # AP-08c (rules/engine.md Nr. 7, canonical-json.md): Engine-Bundle unter Jint rechnet dieselben Hashes wie Node –
  # feste Testvektoren und 500 zufällige PlanInput. Bricht dieser Auftrag, würde das Plugin offline anders planen.
  engine-parity:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGINE: ${{ needs.changes.outputs.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: pnpm install --frozen-lockfile
      - name: Engine bündeln (engine.iife.js, ES2020)
        if: env.ENGINE == 'true'
        run: pnpm engine:bundle
      - name: Erwartung mit Node (500 Pläne)
        if: env.ENGINE == 'true'
        run: pnpm engine:parity --count 500 --seed 1
      # AP-16a: ApiClient gegen den NINA-Test-Server (TestServerIntegrationTests) – der Server prüft jede Anfrage
      # mit den zod-Verträgen; ohne NINA_TEST_SERVER_URL kehren die Tests sofort zurück.
      - name: NINA-Test-Server starten (Szenario one-night)
        run: |
          pnpm nina-test-server --scenario one-night --port 8787 --host 127.0.0.1 > nina-test-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8787/test/report && exit 0; sleep 1; done
          cat nina-test-server.log; exit 1
      - name: Parität unter Jint und ApiClient gegen den Test-Server
        env:
          NINA_TEST_SERVER_URL: http://127.0.0.1:8787/api
        # Ohne Engine-Änderung nur ApiClient gegen den Test-Server (die Parität mit Jint entfällt, s. Auftrag changes).
        run: |
          if [ "$ENGINE" = "true" ]; then dotnet test -c Release apps/nina-plugin/NinaPm.Core.Tests
          else dotnet test -c Release apps/nina-plugin/NinaPm.Core.Tests --filter "FullyQualifiedName!~Parity"; fi
      - name: Test-Server wurde wirklich aufgerufen
        run: |
          curl -sf http://127.0.0.1:8787/test/report > report.json
          node -e "const r=require('./report.json'); const ok=r.sessions.some(s=>s.status==='completed') && r.captures.length>0 && r.heartbeats.count>0; console.log(JSON.stringify({plans:r.plans.length,sessions:r.sessions.length,captures:r.captures.length,heartbeats:r.heartbeats.count})); process.exit(ok?0:1)"

  # Kopfloser Nachtlauf (ops/plugin-test-protocol.md „Kopfloser Nachtlauf“): Plugin-Kern mit simuliertem NINA gegen
  # den Test-Server mit virtueller Uhr – die Protokolle aus tools/nina-sim/runs/ in Sekunden, Schritte automatisch
  # geprüft, danach test-run:check. Ergebnisordner als Artefakt plugin-sim.
  plugin-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: pnpm install --frozen-lockfile
      - name: Kopfloser Nachtlauf (alle Läufe)
        run: pnpm plugin:sim --out sim-runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-sim
          path: sim-runs
          retention-days: 14

  # AP-S2a (TK 10.4): Laufzeit von planNight unter Jint auf dem x64-Runner – Messwert, keine Abnahmegrenze.
  # Ergebnis als Artefakt jint-runtime (docs/adr/ADR-S2a-jint.md).
  jint-runtime:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm engine:bundle
      - name: Eingaben und Node-Vergleich
        run: pnpm engine:bench
      - name: Messung unter Jint (Stufen bis 30 × 3 × 5)
        run: dotnet run -c Release --project spikes/jint-runtime -- --runs 3 --quick
      - uses: actions/upload-artifact@v4
        with:
          name: jint-runtime
          path: packages/engine/build/jint-bench-result.json
          retention-days: 30
