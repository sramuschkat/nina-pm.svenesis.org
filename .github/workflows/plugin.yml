name: plugin

# NINA-Plugin (TK 18, 10.5). AP-S2c: Build-Nachweis an den Projekten unter spikes/nina-build/; AP-16a zieht die Aufträge
# auf die echte Lösung (apps/nina-plugin) und ergänzt Adapter-Tests, ZIP und Release beim Tag plugin-v*.
# Übersetzt wird gegen die NuGet-Pakete NINA.* in der Version aus apps/nina-plugin/Directory.Build.props (ADR-S2c).
# AP-08c: engine-parity prüft die Engine unter Jint gegen Node (auch bei jeder Änderung in packages/engine).

on:
  pull_request:
    paths:
      - 'apps/nina-plugin/**'
      - 'spikes/nina-build/**'
      - 'spikes/jint-runtime/**'
      - 'packages/engine/**'
      - 'tools/engine-bundle/**'
      - 'tools/nina-build-check.sh'
      - '.github/workflows/plugin.yml'
  push:
    branches: [main]
    paths:
      - 'apps/nina-plugin/**'
      - 'spikes/nina-build/**'
      - 'spikes/jint-runtime/**'
      - 'packages/engine/**'
      - 'tools/engine-bundle/**'
      - 'tools/nina-build-check.sh'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sichert die Entwicklung ohne Windows: bricht dieser Auftrag, ist der lokale Arbeitsablauf auf macOS/Linux kaputt.
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Ohne zusätzliche -p:-Schalter: Directory.Build.props/.targets genügen (TK 10.5).
      - name: Kern bauen und testen
        run: dotnet test -c Release spikes/nina-build/Core.Tests
      - name: Adapter mit UseWPF, ohne XAML (b)
        run: dotnet build -c Release spikes/nina-build/Adapter
      - name: Adapter ohne UseWPF (c)
        run: dotnet build -c Release spikes/nina-build/AdapterNoWpf
      - name: Ansichten mit XAML (d)
        run: dotnet build -c Release spikes/nina-build/Ui
      - name: NINA-Version, Ausgabe und keine DLL im Git
        run: tools/nina-build-check.sh spikes/nina-build

  # Derselbe Build auf Windows; AP-16a ergänzt hier Adapter-Tests, dotnet publish und die ZIP.
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Kern bauen und testen
        run: dotnet test -c Release spikes/nina-build/Core.Tests
      - name: Adapter und Ansichten bauen
        run: |
          dotnet build -c Release spikes/nina-build/Adapter
          dotnet build -c Release spikes/nina-build/AdapterNoWpf
          dotnet build -c Release spikes/nina-build/Ui

  # AP-08c (rules/engine.md Nr. 7, canonical-json.md): Engine-Bundle unter Jint rechnet dieselben Hashes wie Node –
  # feste Testvektoren und 500 zufällige PlanInput. Bricht dieser Auftrag, würde das Plugin offline anders planen.
  engine-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: pnpm install --frozen-lockfile
      - name: Engine bündeln (engine.iife.js, ES2020)
        run: pnpm engine:bundle
      - name: Erwartung mit Node (500 Pläne)
        run: pnpm engine:parity --count 500 --seed 1
      - name: Parität unter Jint
        run: dotnet test -c Release apps/nina-plugin/NinaPm.Core.Tests

  # AP-S2a (TK 10.4): Laufzeit von planNight unter Jint auf dem x64-Runner – Messwert, keine Abnahmegrenze.
  # Ergebnis als Artefakt jint-runtime (docs/adr/ADR-S2a-jint.md).
  jint-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm engine:bundle
      - name: Eingaben und Node-Vergleich
        run: pnpm engine:bench
      - name: Messung unter Jint (Stufen bis 30 × 3 × 5)
        run: dotnet run -c Release --project spikes/jint-runtime -- --runs 3 --quick
      - uses: actions/upload-artifact@v4
        with:
          name: jint-runtime
          path: packages/engine/build/jint-bench-result.json
          retention-days: 30
