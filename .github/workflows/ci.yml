# CI nach TK 18 (AP-01: install, lint, typecheck, test, build, gitleaks).
# GitHub hat keinen AWS-Zugang (E1): dieser Workflow prüft und baut nur, er deployt nie.
# OpenAPI-Diff läuft in `pnpm test` (AP-05), E2E seit AP-04a, a11y seit AP-06a.
#
# Tempo (24.09.2026): Die Prüfungen laufen als parallele Jobs statt nacheinander; Playwright-Browser
# kommen aus dem Cache; reine Doku-Änderungen (Arbeitspakete, Changelog, Betrieb, Specs) überspringen
# Tests, Build und E2E. Übersprungene Jobs gelten für GitHub als erfolgreich.
# Tempo (26.09.2026, Entscheidung Sven): `test` läuft in 2, die E2E-Suite in 4 Shards auf je eigenem Runner
# (eigene Datenbank bzw. eigener lokaler Stack je Shard). Sammel-Jobs unter den bisherigen Namen `test` und
# `e2e + a11y (Playwright, lokaler Stack)` sind nur grün, wenn alle Shards grün (oder übersprungen) sind –
# Pflicht-Prüfungen in den Branch-Regeln bleiben damit gültig. Playwright verteilt beim Sharden einzelne Tests
# (`fullyParallel`), E2E läuft in 4 Shards. Zwei Vitest-Worker brachten auf dem 2-vCPU-Runner nichts (gemessen
# 172/157 s statt 173 s) und ließen zeitkritische Tests ins Timeout laufen – deshalb bleibt es bei einem.
# Minuten (Entscheidung Sven): Nach `pnpm pr:land` hat derselbe Stand gerade im PR bestanden – auf `main`
# laufen deshalb nur lint · typecheck, build und gitleaks; Tests und E2E auf `main` prüft jede Nacht nightly.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Änderungen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Nur Doku geändert?
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Doku ohne Wirkung auf Code oder Tests; alles andere (auch docs/contracts, docs/api, docs/seed,
          # docs/test-runs, docs/concept, docs/rules) löst die volle CI aus.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/CHANGELOG.md|docs/changelog.d/*|docs/work-packages/*|docs/ops/*|docs/history/*|docs/adr/*|docs/specs/*|docs/runbooks/*|CLAUDE.md|START.md|README.md|*/README.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code geändert: $code"

  static:
    name: lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test-shard:
    name: test (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # PostgreSQL 16 als DSQL-Ersatz für Migrationen, Rechte- und Repository-Tests (TK 17, 18).
    # Repeatable Read setzt jede Verbindung selbst (Service-Container kennen kein `command`).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ninapm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ninapm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/2

  test:
    name: test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle Test-Shards grün?
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  build:
    name: build · cdk synth
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # cdk synth ohne AWS-Zugang: Lookup-Werte aus infra/cdk.context.json (TK 18)
      - run: pnpm cdk synth --no-lookups --no-notices --quiet

  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Prod-naher Stack: gebaute SPA hinter den Headern aus iam.md §10 + API im Node-Adapter mit Test-Login
    # und PGlite (TK 17); kein AWS, kein Docker. Enthält `pnpm test:a11y` (a11y.spec.ts, TK 18).
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw
        name: Playwright-Version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Chromium installieren (nur ohne Cache)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Systembibliotheken für Chromium (mit Cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: e2e + a11y (Playwright, lokaler Stack)
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle E2E-Shards grün?
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
