# CI nach TK 18 (AP-01: install, lint, typecheck, test, build, gitleaks).
# GitHub hat keinen AWS-Zugang (E1): dieser Workflow prüft und baut nur, er deployt nie.
# OpenAPI-Diff läuft in `pnpm test` (AP-05), E2E seit AP-04a, a11y seit AP-06a.
#
# Tempo (24.09.2026): Die Prüfungen laufen als parallele Jobs statt nacheinander; Playwright-Browser
# kommen aus dem Cache; reine Doku-Änderungen (Arbeitspakete, Changelog, Betrieb, Specs) überspringen
# Tests, Build und E2E – **nur in PRs**. Übersprungene Jobs gelten für GitHub als erfolgreich; auf `main` läuft
# deshalb immer die volle CI (28.09.2026): Sonst wäre ein reiner Doku-Merge nach einem roten `main`-Lauf grün,
# und `pnpm deploy:prod` hätte den ungeprüften Stand akzeptiert.
# Tempo (26.09.2026, Entscheidung Sven): `test` und die E2E-Suite laufen in Shards auf je eigenem Runner
# (eigene Datenbank bzw. eigener lokaler Stack je Shard). Sammel-Jobs unter den bisherigen Namen `test` und
# `e2e + a11y (Playwright, lokaler Stack)` sind nur grün, wenn alle Shards grün (oder übersprungen) sind –
# Pflicht-Prüfungen in den Branch-Regeln bleiben damit gültig. Playwright verteilt beim Sharden einzelne Tests
# (`fullyParallel`).
# Öffentliches Repo (seit 26.09.2026): Standard-Runner mit 4 vCPU und ohne Minutenbegrenzung. Deshalb
# `test` in 3 und E2E in 6 Shards (13 gleichzeitige Jobs, Grenze 20), Vitest mit 3 Workern (vitest.config.ts),
# Typecheck inkrementell und Lint/Prettier mit Cache (aus dem letzten Lauf auf `main`), und Tests samt E2E
# wieder auch auf `main` – ein Fehler durch zwei einzeln grüne PRs fällt so sofort auf.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ein neuer Push ersetzt den laufenden Lauf – in PRs wie auf `main`. Landen mehrere PRs nacheinander, zählt für
# den Deploy nur der letzte Stand (tools/deploy/src/ci-gate.ts); überlappende Läufe mit je 15 Jobs warteten
# sonst minutenlang auf freie Runner (20 je Repo). Die Sammeljobs laufen mit `!cancelled()`, damit ein
# abgebrochener Lauf grau („cancelled“) endet statt rot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Änderungen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Nur Doku geändert?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Nur in PRs: Doku ohne Wirkung auf Code oder Tests überspringt Tests, Build und E2E. Auf `main` (push)
          # immer volle CI – der Vergleich mit dem Vorgänger würde einen roten Vorgänger-Lauf verdecken.
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "Kein PR: volle CI"; exit 0; fi
          # Alles andere (auch docs/contracts, docs/api, docs/seed, docs/test-runs, docs/concept, docs/rules) löst
          # die volle CI aus – ebenso die geschützten Kopien (legacy/, packages/catalog-data/, geprüft von
          # tools/repo-check), auch deren README.md. Die erste passende Zeile gewinnt.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              legacy/*|packages/catalog-data/*) code=true ;;
              docs/CHANGELOG.md|docs/changelog.d/*|docs/work-packages/*|docs/ops/*|docs/history/*|docs/adr/*|docs/specs/*|docs/runbooks/*|CLAUDE.md|START.md|README.md|*/README.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code geändert: $code"

  static:
    name: lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nach der Installation wiederherstellen (sonst legt pnpm node_modules neu an). PRs lesen nur den Stand
      # von `main`; gespeichert wird nur auf `main` (Speichern kostet rund 20 s je Lauf).
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.cache/prettier
            **/*.tsbuildinfo
            !**/node_modules/**/*.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            static-${{ runner.os }}-
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.cache/prettier
            **/*.tsbuildinfo
            !**/node_modules/**/*.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  test-shard:
    name: test (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # PostgreSQL 16 als DSQL-Ersatz für Migrationen, Rechte- und Repository-Tests (TK 17, 18).
    # Repeatable Read setzt jede Verbindung selbst (Service-Container kennen kein `command`).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ninapm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ninapm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/3

  test:
    name: test
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle Test-Shards grün?
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  build:
    name: build · cdk synth
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # cdk synth ohne AWS-Zugang: Lookup-Werte aus infra/cdk.context.json (TK 18)
      - run: pnpm cdk synth --no-lookups --no-notices --quiet

  e2e-shard:
    name: e2e (${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Prod-naher Stack: gebaute SPA hinter den Headern aus iam.md §10 + API im Node-Adapter mit Test-Login
    # und PGlite (TK 17); kein AWS, kein Docker. Enthält `pnpm test:a11y` (a11y.spec.ts, TK 18).
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw
        name: Playwright-Version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # Systembibliotheken (Schriften, mesa; etwa 60 MB) aus dem apt-Cache statt vom Ubuntu-Mirror: der brauchte
      # an manchen Tagen 7–8 min dafür (30.09.2026). Schlüssel wechselt wöchentlich, damit Sicherheits-Updates
      # nachkommen; ältere Pakete aus `restore-keys` lädt apt nur dort nach, wo sich die Version geändert hat.
      - id: week
        name: Kalenderwoche
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-${{ steps.week.outputs.week }}
          restore-keys: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-
      - name: Systembibliotheken für Chromium (apt-Cache)
        run: |
          mkdir -p ~/.cache/playwright-apt
          printf 'APT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99keep-downloaded >/dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo cp ~/.cache/playwright-apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          pnpm exec playwright install-deps chromium
          cp /var/cache/apt/archives/*.deb ~/.cache/playwright-apt/ 2>/dev/null || true
          echo "apt-Cache: $(ls ~/.cache/playwright-apt | wc -l) Pakete"
      - name: Chromium installieren (nur ohne Cache)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: e2e + a11y (Playwright, lokaler Stack)
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle E2E-Shards grün?
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
